version: '3.8'

services:
  app:
    build: .
    container_name: hrep-erequests-app
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=local
      - AUTH_MODE=mock
      - STORAGE_TYPE=local
      - DATABASE_URL=postgresql://dev:devpass@db:5432/erequests_local
    volumes:
      - ./app:/app/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    container_name: hrep-erequests-db
    restart: always
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=devpass
      - POSTGRES_DB=erequests_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d erequests_local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
